<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشف أمراض النباتات | Plant Disease Detector</title>

    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, rgba(15, 32, 39, 0.85), rgba(32, 58, 67, 0.85), rgba(44, 83, 100, 0.85)),
                        url('1.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            margin: 0;
            overflow-x: hidden;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* تحديد حجم ثابت ومنتظم لمكان الرفع والصورة عشان السكرول يختفي */
        .upload-area {
            border: 2px dashed #198754;
            border-radius: 16px;
            background-color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            max-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .upload-area:hover {
            background-color: rgba(25, 135, 84, 0.08);
            border-color: #146c43;
        }

        #imagePreview {
            max-height: 180px;
            width: auto;
            object-fit: contain;
            border-radius: 10px;
        }

        .btn-custom {
            background: linear-gradient(45deg, #198754, #20c997);
            border: none;
            color: white;
            font-weight: 700;
            border-radius: 12px;
            padding: 10px 20px;
            box-shadow: 0 6px 15px rgba(25, 135, 84, 0.3);
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background: linear-gradient(45deg, #146c43, #198754);
            color: white;
        }

        .result-box {
            background: #ffffff;
            border-radius: 14px;
            border-right: 5px solid #198754;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .floating-icon {
            position: absolute;
            color: rgba(255, 255, 255, 0.15);
            z-index: -1;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }
    </style>
</head>
<body>

    <!-- أيقونات الخلفية المتحركة -->
    <i class="fa-solid fa-leaf floating-icon fa-3x" style="top: 8%; right: 8%; animation-delay: 0s;"></i>
    <i class="fa-solid fa-seedling floating-icon fa-4x" style="bottom: 8%; left: 6%; animation-delay: 2s;"></i>
    <i class="fa-solid fa-wheat-awn floating-icon fa-3x" style="bottom: 10%; right: 10%; animation-delay: 1s;"></i>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                
                <div class="main-card p-4 text-center position-relative">
                    
                    <!-- Header -->
                    <div class="mb-3">
                        <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle p-2 mb-2 shadow-sm">
                            <i class="fa-solid fa-microscope fa-2x fa-bounce" style="--fa-bounce-jump-opacity: 0.8; --fa-bounce-height: -8px;"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">كاشف أمراض أوراق البطاطس</h3>
                        <p class="text-muted small mb-0">تشخيص الحالة بالذكاء الاصطناعي</p>
                    </div>

                    <!-- Upload Area المحكومة بـ Max Height -->
                    <div id="dropZone" class="upload-area p-3 mb-3" onclick="document.getElementById('fileInput').click()">
                        <input type="file" id="fileInput" accept="image/*" class="d-none">
                        
                        <div id="uploadPrompt" class="py-2">
                            <i class="fa-solid fa-cloud-arrow-up fa-3x text-success mb-2 fa-beat-fade" style="--fa-beat-fade-opacity: 0.4; --fa-beat-fade-scale: 1.05;"></i>
                            <h6 class="fw-bold text-dark mb-1">اضغط هنا أو اسحب الصورة</h6>
                            <span class="badge bg-success-subtle text-success px-2 py-1 rounded-pill small">
                                PNG, JPG, JPEG
                            </span>
                        </div>

                        <img id="imagePreview" class="img-fluid d-none shadow-sm" />
                    </div>

                    <!-- Action Button -->
                    <button id="predictBtn" onclick="uploadAndPredict()" class="btn btn-custom w-100 d-none mb-3">
                        <i class="fa-solid fa-wand-magic-sparkles me-2"></i> بدء فحص الورقة الآن
                    </button>

                    <!-- Results Section -->
                    <div id="resultBox" class="result-box p-3 text-start d-none mb-3">
                        <div class="d-flex align-items-center mb-2">
                            <i class="fa-solid fa-square-poll-vertical text-success fs-5 me-2"></i>
                            <h6 class="fw-bold mb-0 text-dark">نتيجة التشخيص</h6>
                        </div>

                        <div class="d-flex justify-content-between align-items-center p-2 bg-light rounded-3 mb-2">
                            <span class="text-muted small fw-bold"><i class="fa-solid fa-virus me-1 text-warning"></i> حالة الورقة:</span>
                            <span id="resClass" class="fw-bold text-success small">--</span>
                        </div>

                        <div class="d-flex justify-content-between align-items-center p-2 bg-light rounded-3">
                            <span class="text-muted small fw-bold"><i class="fa-solid fa-chart-line me-1 text-primary"></i> نسبة الدقة:</span>
                            <span id="resConfidence" class="fw-bold text-primary small">--%</span>
                        </div>
                    </div>

                    <!-- Footer مع إضافة التوقيع باسمك -->
                    <div class="pt-2 border-top text-muted small d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid fa-code me-1 text-success"></i> Developed by <strong>Kamel Ramadan</strong></span>
                        <span class="badge bg-light text-secondary border">FastAPI + CNN Model</span>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const imagePreview = document.getElementById('imagePreview');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const predictBtn = document.getElementById('predictBtn');
        const resultBox = document.getElementById('resultBox');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.src = event.target.result;
                    imagePreview.classList.remove('d-none');
                    uploadPrompt.classList.add('d-none');
                    predictBtn.classList.remove('d-none');
                    resultBox.classList.add('d-none');
                };
                reader.readAsDataURL(file);
            }
        });

        async function uploadAndPredict() {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            predictBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i> جاري التحليل...`;
            predictBtn.disabled = true;

            try {
                const response = await fetch("http://localhost:8000/predict", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();

                let arabicClass = "";
                if (data.class === "Early Blight") arabicClass = "لفحة مبكرة (Early Blight) ⚠️";
                else if (data.class === "Late Blight") arabicClass = "لفحة متأخرة (Late Blight) 🚨";
                else if (data.class === "Healthy") arabicClass = "سليمة وصحية ✅";
                else arabicClass = data.class;

                document.getElementById('resClass').innerText = arabicClass;
                document.getElementById('resConfidence').innerText = `${data.confidence}%`;
                
                resultBox.classList.remove('d-none');
            } catch (err) {
                alert("حدث خطأ في الاتصال بالسيرفر! تأكد من تشغيل FastAPI بـ python main.py أولاً.");
            } finally {
                predictBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles me-2"></i> بدء فحص الورقة الآن`;
                predictBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
